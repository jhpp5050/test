<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 집 장보기</title>
<style>
  :root {
    --bg: #f1f9f3;
    --card: #ffffff;
    --text: #1f3a2b;
    --muted: #6f8a7a;
    --line: #dcefe2;
    --accent: #3fb672;
    --accent-dark: #2e9a5c;
    --accent-soft: #e2f6e9;
    --mint: #7fd8b8;
    --danger: #e0685a;
    --shadow: 0 4px 14px rgba(46, 154, 92, 0.10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }

  header {
    background: linear-gradient(135deg, var(--accent), var(--mint));
    color: #fff;
    border-radius: 22px;
    padding: 22px 22px 20px;
    box-shadow: var(--shadow);
  }
  header h1 { margin: 0 0 4px; font-size: 1.6rem; }
  #progressText { margin: 0 0 10px; font-size: 0.95rem; opacity: 0.95; }
  .bar { height: 10px; background: rgba(255,255,255,0.35); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: #fff; border-radius: 99px; transition: width .3s; }

  form.add {
    margin-top: 18px;
    background: var(--card);
    border-radius: 18px;
    padding: 14px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: 1fr 90px;
    gap: 8px;
  }
  form.add input, form.add select {
    font: inherit;
    padding: 10px 12px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: #fbfefc;
    color: var(--text);
    min-width: 0;
  }
  form.add input:focus, form.add select:focus { outline: none; border-color: var(--accent); }
  form.add select { grid-column: 1; }
  form.add button {
    grid-column: 2;
    font: inherit; font-weight: 700;
    border: 0; border-radius: 12px;
    background: var(--accent); color: #fff;
    cursor: pointer;
  }
  form.add button:hover { background: var(--accent-dark); }

  .empty {
    margin-top: 28px; text-align: center; color: var(--muted);
    background: var(--card); border-radius: 18px; padding: 32px 16px;
    box-shadow: var(--shadow);
  }
  .empty .big { font-size: 2.4rem; }

  .cat {
    margin-top: 16px;
    background: var(--card);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .cat h2 {
    margin: 0; padding: 12px 16px;
    font-size: 1.05rem;
    background: var(--accent-soft);
    display: flex; justify-content: space-between; align-items: center;
  }
  .cat h2 .left { font-size: 0.85rem; font-weight: 600; color: var(--accent-dark); }
  .cat ul { list-style: none; margin: 0; padding: 4px 0; }
  .cat li {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px 10px 16px;
    border-top: 1px solid var(--line);
  }
  .cat li:first-child { border-top: 0; }
  .check {
    flex: none;
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--accent);
    background: #fff; cursor: pointer;
    display: grid; place-items: center;
    color: #fff; font-size: 16px; font-weight: 700;
    padding: 0;
  }
  .label { flex: 1; min-width: 0; cursor: pointer; word-break: break-all; }
  .qty {
    margin-left: 6px; font-size: 0.85rem; color: var(--accent-dark);
    background: var(--accent-soft); padding: 1px 8px; border-radius: 99px;
    white-space: nowrap;
  }
  .del {
    flex: none; border: 0; background: none; cursor: pointer;
    color: #b8c9bf; font-size: 1.2rem; width: 32px; height: 32px; border-radius: 50%;
  }
  .del:hover { color: var(--danger); background: #fdeeee; }

  li.done .check { background: var(--accent); }
  li.done .label { color: var(--muted); text-decoration: line-through; opacity: 0.7; }
  li.done .qty { opacity: 0.6; }

  .actions { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
  .actions button {
    flex: 1; min-width: 140px;
    font: inherit; font-weight: 600;
    padding: 12px; border-radius: 14px; cursor: pointer;
    border: 1.5px solid var(--accent); background: var(--card); color: var(--accent-dark);
  }
  .actions button:hover { background: var(--accent-soft); }
  .actions button.warn { border-color: var(--danger); color: var(--danger); }
  .actions button.warn:hover { background: #fdeeee; }
  .actions button:disabled { opacity: 0.4; cursor: default; background: var(--card); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛒 우리 집 장보기</h1>
    <p id="progressText">아직 품목이 없어요</p>
    <div class="bar"><div id="progressBar"></div></div>
  </header>

  <form class="add" id="addForm" autocomplete="off">
    <input id="nameInput" placeholder="품목 이름 (예: 계란)" required>
    <input id="qtyInput" placeholder="수량">
    <select id="catInput"></select>
    <button type="submit">추가</button>
  </form>

  <div id="list"></div>

  <div class="actions" id="actions">
    <button id="uncheckAll">🔄 체크 모두 해제</button>
    <button id="clearDone" class="warn">🧹 산 것 지우기</button>
  </div>
</div>

<script>
  const CATEGORIES = [
    { id: 'veg',    name: '🥬 채소·과일' },
    { id: 'meat',   name: '🥩 고기·생선' },
    { id: 'dairy',  name: '🥛 유제품·계란' },
    { id: 'grain',  name: '🍞 곡물·면·빵' },
    { id: 'sauce',  name: '🧂 양념·소스' },
    { id: 'snack',  name: '🍪 간식·음료' },
    { id: 'living', name: '🧻 생활용품' },
    { id: 'etc',    name: '📦 기타' },
  ];
  const KEY = 'our-home-groceries-v1';

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY));
      return Array.isArray(data) ? data : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }

  let items = load();

  const $ = (id) => document.getElementById(id);
  const catInput = $('catInput');
  CATEGORIES.forEach(c => {
    const o = document.createElement('option');
    o.value = c.id; o.textContent = c.name;
    catInput.appendChild(o);
  });
  try { catInput.value = localStorage.getItem(KEY + '-lastcat') || 'veg'; } catch (e) {}

  function render() {
    const list = $('list');
    list.innerHTML = '';

    const total = items.length;
    const done = items.filter(i => i.done).length;
    $('progressText').textContent = total
      ? (done === total ? `${total}개 모두 담았어요! 🎉` : `${total}개 중 ${done}개 담음`)
      : '아직 품목이 없어요';
    $('progressBar').style.width = total ? (done / total * 100) + '%' : '0';

    $('uncheckAll').disabled = done === 0;
    $('clearDone').disabled = done === 0;
    $('actions').style.display = total ? '' : 'none';

    if (!total) {
      list.innerHTML = '<div class="empty"><div class="big">🥕</div>첫 품목을 추가해 보세요</div>';
      return;
    }

    CATEGORIES.forEach(cat => {
      const inCat = items.filter(i => i.cat === cat.id);
      if (!inCat.length) return;
      // 안 산 것 먼저, 산 것은 맨 아래로 (각각 추가한 순서 유지)
      const sorted = [...inCat.filter(i => !i.done), ...inCat.filter(i => i.done)];
      const left = inCat.filter(i => !i.done).length;

      const sec = document.createElement('section');
      sec.className = 'cat';
      const h = document.createElement('h2');
      h.innerHTML = `<span></span><span class="left"></span>`;
      h.children[0].textContent = cat.name;
      h.children[1].textContent = left ? `${left}개 남음` : '다 담았어요 ✓';
      sec.appendChild(h);

      const ul = document.createElement('ul');
      sorted.forEach(item => {
        const li = document.createElement('li');
        if (item.done) li.className = 'done';

        const chk = document.createElement('button');
        chk.className = 'check';
        chk.textContent = item.done ? '✓' : '';
        chk.setAttribute('aria-label', item.done ? '체크 해제' : '체크');
        chk.onclick = () => toggle(item.id);

        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = item.name;
        if (item.qty) {
          const q = document.createElement('span');
          q.className = 'qty';
          q.textContent = item.qty;
          label.appendChild(q);
        }
        label.onclick = () => toggle(item.id);

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '×';
        del.title = '삭제';
        del.setAttribute('aria-label', item.name + ' 삭제');
        del.onclick = () => { items = items.filter(i => i.id !== item.id); save(); render(); };

        li.append(chk, label, del);
        ul.appendChild(li);
      });
      sec.appendChild(ul);
      list.appendChild(sec);
    });
  }

  function toggle(id) {
    const it = items.find(i => i.id === id);
    if (it) { it.done = !it.done; save(); render(); }
  }

  $('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('nameInput').value.trim();
    if (!name) return;
    items.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name,
      qty: $('qtyInput').value.trim(),
      cat: catInput.value,
      done: false,
    });
    try { localStorage.setItem(KEY + '-lastcat', catInput.value); } catch (e) {}
    save(); render();
    $('nameInput').value = ''; $('qtyInput').value = '';
    $('nameInput').focus();
  });

  $('uncheckAll').onclick = () => {
    if (!confirm('체크를 모두 해제할까요?\n항목은 그대로 남아요.')) return;
    items.forEach(i => i.done = false); save(); render();
  };
  $('clearDone').onclick = () => {
    const n = items.filter(i => i.done).length;
    if (!confirm(`체크한 ${n}개 항목을 목록에서 지울까요?`)) return;
    items = items.filter(i => !i.done); save(); render();
  };

  // 다른 탭에서 바꾼 내용도 반영
  window.addEventListener('storage', (e) => { if (e.key === KEY) { items = load(); render(); } });

  render();
</script>
</body>
</html>
